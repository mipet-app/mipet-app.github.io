<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Kolita</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFCFA; --soft:#EDF2EA; --mid:#7C9877; --deep:#556F51; --ink:#3C4A3A; --mut:#93A28F;
  --line:#E4EAE1; --alert:#C87B5B;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito Sans',sans-serif;background:#F1F3EF;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 16px;color:var(--ink);}
.box{max-width:360px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:44px 28px;text-align:center;box-shadow:0 14px 40px rgba(70,85,66,.08);}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;}
.brand-k{width:34px;height:34px;}
.brand-name{font-family:'Quicksand',sans-serif;font-weight:700;font-size:20px;}
.spinner{width:40px;height:40px;border:4px solid var(--soft);border-top-color:var(--mid);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Fraunces',serif;font-size:20px;font-weight:700;}
p{font-size:13px;color:var(--mut);font-weight:600;line-height:1.65;margin-top:8px;}
.code{display:inline-block;margin-top:12px;background:var(--soft);color:var(--deep);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800;letter-spacing:2px;}
a.btn{display:inline-block;margin-top:20px;background:var(--mid);color:#fff;text-decoration:none;font-size:13.5px;font-weight:800;padding:13px 24px;border-radius:14px;}
.hide{display:none;}
</style>
</head>
<body>

<div class="box">
  <div class="brand">
    <svg class="brand-k" viewBox="0 0 92 92"><rect x="2" y="2" width="88" height="88" rx="24" fill="#7C9877"/><path d="M32 24 L32 68" stroke="#FBFCFA" stroke-width="9" stroke-linecap="round"/><path d="M34 48 C 48 46, 58 36, 56 24" fill="none" stroke="#FBFCFA" stroke-width="9" stroke-linecap="round"/><path d="M34 48 C 48 52, 58 60, 62 70" fill="none" stroke="#DCE8D8" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="brand-name">kolita</span>
  </div>

  <div id="cargando">
    <div class="spinner"></div>
    <p>Abriendo el carnet…</p>
  </div>

  <div id="noEncontrado" class="hide">
    <div style="font-size:38px;">🐾</div>
    <h1>No encontramos este carnet</h1>
    <p>Puede que el código esté incompleto o mal leído.</p>
    <div class="code" id="codigoMostrado"></div>
    <p style="margin-top:14px;">Si tienes al peludo contigo y el código no abre, escríbenos a appmipet@gmail.com con el código de la placa.</p>
    <a class="btn" href="/mis-carnets.html">Buscar por correo o celular</a>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// KOLITA · PÁGINA PUENTE
// Recibe el código corto grabado en la placa (kolita.co/p/?c=A7K2M9X)
// y lleva al carnet. Existe por dos razones:
//   1. El QR queda más pequeño y escanea mejor en metal.
//   2. Si algún día cambia la estructura del sitio o el dominio, las
//      placas ya grabadas siguen funcionando: se arregla aquí y listo.
// ═══════════════════════════════════════════════
var SUPABASE_URL = 'https://fdwbstqxqdailyeedmuo.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkd2JzdHF4cWRhaWx5ZWVkbXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MDEwMDEsImV4cCI6MjA5OTQ3NzAwMX0.GG6O9z1Exu5z0DsM8Fzk-fx1h2BIII0I9flMVZiPwIw';

function qs(id){ return document.getElementById(id); }

function fallo(codigo){
  qs('cargando').classList.add('hide');
  if(codigo) qs('codigoMostrado').textContent = codigo;
  qs('noEncontrado').classList.remove('hide');
}

async function abrir(){
  var p = new URLSearchParams(location.search);
  // acepta ?c= y también ?C= por si algún lector cambia las mayúsculas
  var codigo = (p.get('c') || p.get('C') || '').trim().toUpperCase();

  if(!codigo){ return fallo(''); }

  try{
    // Se le pregunta a la base por el código, y responde con un solo carnet.
    // Antes se consultaba la tabla directamente; ahora ni siquiera hace falta
    // que esta página pueda ver la tabla.
    var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/resolve_short_code', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ p_code: codigo })
    });
    if(!res.ok) throw new Error('net');
    var id = await res.json();
    if(!id){ return fallo(codigo); }

    // replace() en vez de href: así el botón "atrás" del celular no
    // devuelve a esta página en un ciclo infinito
    location.replace('/perfil.html?id=' + encodeURIComponent(id));
  }catch(e){
    console.error(e);
    fallo(codigo);
  }
}

abrir();
</script>
</body>
</html>
