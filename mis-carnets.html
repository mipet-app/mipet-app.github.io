<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-381DD74KP3"></script>

<title>Mis carnets — Kolita</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Quicksand:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" integrity="sha384-faMlYZUtkJj+Sh6Bmu/L0GzPcraRWN6CW+9RH3GUrK/Z0WS9tgaNNt0tHiLxsbdb" crossorigin="anonymous"></script>
<script src="js/kolita-auth.js"></script>
<script src="js/kolita-login.js"></script>
<style>
:root{
  --bg:#FBFCFA; --soft:#EDF2EA; --mid:#7C9877; --deep:#556F51; --ink:#3C4A3A; --mut:#93A28F;
  --line:#E4EAE1; --alert:#C87B5B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito Sans',sans-serif;background:#F1F3EF;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 60px;color:var(--ink);}

.top{max-width:460px;width:100%;display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.brand-k{width:32px;height:32px;flex-shrink:0;}
.brand-name{font-family:'Quicksand',sans-serif;font-weight:700;font-size:18px;}
.top a{margin-left:auto;font-size:12px;font-weight:800;color:var(--deep);text-decoration:none;}

.wrap{max-width:460px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 14px 40px rgba(70,85,66,.08);}
h1{font-family:'Fraunces',serif;font-size:23px;font-weight:700;}
.sub{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.55;}

.spinner{width:34px;height:34px;border:4px solid var(--soft);border-top-color:var(--mid);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

.who{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:13px;padding:10px 13px;margin-bottom:18px;font-size:11.5px;font-weight:700;color:var(--deep);}
.who span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who button{background:none;border:none;color:var(--mut);font-size:11.5px;font-weight:800;cursor:pointer;font-family:'Nunito Sans',sans-serif;text-decoration:underline;flex:none;}

.results-title{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;}
.pet{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;}
.pet-photo{width:60px;height:60px;border-radius:15px;object-fit:cover;background:var(--soft);flex-shrink:0;}
.pet-photo-ph{width:60px;height:60px;border-radius:15px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.pet-info{flex:1;min-width:0;}
.pet-name{font-family:'Fraunces',serif;font-size:19px;font-weight:700;line-height:1.1;}
.pet-breed{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px;}
.pet-code{font-size:10px;color:var(--mut);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.pet-code strong{color:var(--deep);letter-spacing:2px;font-size:11.5px;}
.lost-tag{display:inline-block;background:#FDF7F3;border:1px solid #EAD4C9;color:var(--alert);font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;margin-top:5px;}
.pet-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:800;padding:7px 12px;border-radius:20px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:none;font-family:'Nunito Sans',sans-serif;}
.chip-view{background:var(--soft);color:var(--deep);}
.chip-qr{background:var(--mid);color:#fff;}
.chip-copy{background:#fff;border:1.5px solid var(--line);color:var(--mut);}

.empty{text-align:center;padding:20px 6px;font-size:13px;color:var(--mut);line-height:1.65;}
.empty a{color:var(--deep);font-weight:800;}
.add{display:block;text-align:center;margin-top:6px;background:var(--soft);color:var(--deep);text-decoration:none;font-size:13px;font-weight:800;padding:13px;border-radius:13px;}
.add:hover{background:var(--mid);color:#fff;}

.modal{position:fixed;inset:0;background:rgba(60,74,58,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal.show{display:flex;}
.modal-box{background:var(--bg);border-radius:22px;padding:26px;max-width:320px;width:100%;text-align:center;}
.modal-box h3{font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px;}
.modal-box p{font-size:12px;color:var(--mut);margin-bottom:16px;}
.modal-box img{width:200px;height:200px;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff;}
.modal-btns{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.modal-btns a,.modal-btns button{padding:12px;border-radius:12px;font-size:13px;font-weight:800;text-decoration:none;border:none;cursor:pointer;font-family:'Nunito Sans',sans-serif;}
.dl{background:var(--mid);color:#fff;}
.close{background:#fff;border:1.5px solid var(--line);color:var(--mut);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:60;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div class="top">
  <svg class="brand-k" viewBox="0 0 92 92"><rect x="2" y="2" width="88" height="88" rx="24" fill="#7C9877"/><path d="M32 24 L32 68" stroke="#FBFCFA" stroke-width="9" stroke-linecap="round"/><path d="M34 48 C 48 46, 58 36, 56 24" fill="none" stroke="#FBFCFA" stroke-width="9" stroke-linecap="round"/><path d="M34 48 C 48 52, 58 60, 62 70" fill="none" stroke="#DCE8D8" stroke-width="9" stroke-linecap="round"/></svg>
  <span class="brand-name">kolita</span>
  <a href="index.html">← Inicio</a>
</div>

<div class="wrap">
  <div id="cargando"><div class="spinner"></div></div>
  <div id="loginBox" style="display:none;"></div>
  <div id="panel" style="display:none;">
    <div class="who">
      <span id="whoEmail">—</span>
      <button onclick="cerrarSesion()">Salir</button>
    </div>
    <div class="results-title" id="resultsTitle">Mis carnets</div>
    <div id="petList"></div>
    <a class="add" href="registro.html">+ Crear el carnet de otro peludo</a>
  </div>
</div>

<div class="modal" id="qrModal">
  <div class="modal-box">
    <h3 id="qrPetName">—</h3>
    <p>Escanea o descarga este código para el collar</p>
    <p id="qrCodeTxt" style="font-weight:800;color:var(--deep);letter-spacing:1.5px;margin-top:-10px;margin-bottom:14px;"></p>
    <img id="qrImage" src="" alt="Código QR">
    <div class="modal-btns">
      <a class="dl" id="qrDownload" href="#" download>⬇️ Descargar QR</a>
      <button class="close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// KOLITA · MIS CARNETS
//
// Antes, esta página te mostraba los carnets de cualquiera que escribiera
// un correo o un celular. Bastaba con conocer el dato — que no es ningún
// secreto — para ver los peludos de esa familia y entrar a editarlos.
//
// Ahora entras con tu correo y un código, y solo ves los tuyos. Quién ve
// qué lo decide la base de datos, no esta página.
// ═══════════════════════════════════════════════
var SPECIES_EMOJI = { perro:'🐶', gato:'🐱', conejo:'🐰', ave:'🐦', otro:'🐾' };
var BASE_PERFIL = 'https://kolita.co/perfil.html?id=';
var BASE_CORTO  = 'https://kolita.co/p/?c=';

function qs(id){ return document.getElementById(id); }

async function iniciar(){
  var sesion = await KolitaAuth.sesionActual();
  qs('cargando').style.display = 'none';
  if(sesion) return abrirPanel();
  mostrarLogin();
}

function mostrarLogin(){
  qs('panel').style.display = 'none';
  var caja = qs('loginBox');
  caja.style.display = 'block';
  KolitaLogin.montar(caja, {
    icono: '🔎',
    titulo: 'Entra a tus carnets',
    subtitulo: 'Escribe el correo con el que creaste el carnet de tu peludo y te enviamos un código.',
    // No creamos cuentas desde aquí: si el correo no existe, es más útil
    // decirlo que dejar una cuenta vacía por un correo mal escrito.
    crearSiNoExiste: false,
    nota: 'Kolita no usa contraseñas. Cada vez que entres te enviamos un código nuevo a tu correo.',
    alNoExistir: function(){},
    alEntrar: function(){ caja.style.display = 'none'; abrirPanel(); }
  });
}

async function abrirPanel(){
  qs('loginBox').style.display = 'none';
  qs('panel').style.display = 'block';
  qs('whoEmail').textContent = '👤 ' + (await KolitaAuth.correoDeSesion() || '');

  // Enlaza a esta cuenta los carnets creados antes de que existiera el
  // ingreso. Solo enlaza los que tienen este mismo correo ya confirmado.
  await KolitaAuth.reclamarCarnets();
  await cargarPeludos();
}

async function cargarPeludos(){
  var lista = qs('petList');
  lista.innerHTML = '';
  var r = await KolitaAuth.client
    .from('pets')
    .select('id,name,species,breed,sex,photo_url,short_code,is_lost')
    .order('created_at', { ascending: true });

  if(r.error){
    toast('⚠️ No pudimos cargar tus carnets');
    return;
  }
  var pets = r.data || [];
  qs('resultsTitle').textContent = pets.length === 1 ? '1 carnet' : pets.length + ' carnets';

  if(pets.length === 0){
    var vacio = document.createElement('div');
    vacio.className = 'empty';
    vacio.textContent = '😿 Todavía no hay carnets en esta cuenta. Si creaste el de tu peludo con otro correo, sal e ingresa con ese.';
    lista.appendChild(vacio);
    return;
  }
  pets.forEach(function(p){ lista.appendChild(tarjeta(p)); });
}

// Todo con createElement + textContent: nada de pegar texto dentro del HTML.
function tarjeta(p){
  var url = p.short_code ? (BASE_CORTO + p.short_code) : (BASE_PERFIL + p.id);
  var emoji = SPECIES_EMOJI[(p.species||'').toLowerCase()] || '🐾';
  var breed = [p.breed, p.sex === 'macho' ? 'Macho' : (p.sex === 'hembra' ? 'Hembra' : '')]
                .filter(Boolean).join(' · ') || (p.species||'');

  var card = document.createElement('div');
  card.className = 'pet';

  if(p.photo_url && /^https:\/\//i.test(p.photo_url)){
    var img = document.createElement('img');
    img.className = 'pet-photo'; img.alt = ''; img.src = p.photo_url;
    card.appendChild(img);
  }else{
    var ph = document.createElement('div');
    ph.className = 'pet-photo-ph'; ph.textContent = emoji;
    card.appendChild(ph);
  }

  var info = document.createElement('div');
  info.className = 'pet-info';

  var nm = document.createElement('div');
  nm.className = 'pet-name'; nm.textContent = p.name || 'Sin nombre';
  info.appendChild(nm);

  var br = document.createElement('div');
  br.className = 'pet-breed'; br.textContent = breed;
  info.appendChild(br);

  if(p.short_code){
    var cd = document.createElement('div');
    cd.className = 'pet-code';
    cd.appendChild(document.createTextNode('Código Kolita · '));
    var st = document.createElement('strong'); st.textContent = p.short_code;
    cd.appendChild(st);
    info.appendChild(cd);
  }

  if(p.is_lost){
    var lt = document.createElement('div');
    lt.className = 'lost-tag'; lt.textContent = '🚨 En modo perdido';
    info.appendChild(lt);
  }

  var acts = document.createElement('div');
  acts.className = 'pet-actions';

  var ver = document.createElement('a');
  ver.className = 'chip chip-view'; ver.href = url; ver.target = '_blank'; ver.rel = 'noopener';
  ver.textContent = '👁️ Ver';
  acts.appendChild(ver);

  var qrBtn = document.createElement('button');
  qrBtn.className = 'chip chip-qr'; qrBtn.textContent = '📱 Ver QR';
  qrBtn.onclick = function(){ showQR(p.short_code || '', p.id, p.name || 'peludo'); };
  acts.appendChild(qrBtn);

  var cp = document.createElement('button');
  cp.className = 'chip chip-copy'; cp.textContent = '🔗 Copiar enlace';
  cp.onclick = function(){ copyLink(url); };
  acts.appendChild(cp);

  var ed = document.createElement('a');
  ed.className = 'chip chip-view'; ed.href = 'editar.html?id=' + encodeURIComponent(p.id);
  ed.textContent = '✏️ Editar';
  acts.appendChild(ed);

  info.appendChild(acts);
  card.appendChild(info);
  return card;
}

async function cerrarSesion(){
  await KolitaAuth.salir();
  qs('panel').style.display = 'none';
  mostrarLogin();
}

// ── Modal QR ──
function showQR(shortCode, petId, petName){
  var url = shortCode ? (BASE_CORTO + shortCode) : (BASE_PERFIL + petId);
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&ecc=M&data=' + encodeURIComponent(url) + '&color=556F51&bgcolor=FFFFFF';
  qs('qrPetName').textContent = petName;
  qs('qrCodeTxt').textContent = shortCode ? ('Código Kolita: ' + shortCode) : '';
  qs('qrImage').src = qrUrl;
  qs('qrDownload').href = qrUrl + '&download=1';
  qs('qrDownload').setAttribute('download', 'QR-' + petName + '.png');
  qs('qrModal').classList.add('show');
}
function closeModal(){ qs('qrModal').classList.remove('show'); }
qs('qrModal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

function copyLink(url){
  navigator.clipboard.writeText(url).then(function(){ toast('✅ Enlace copiado'); })
  .catch(function(){ toast('⚠️ No se pudo copiar'); });
}

function toast(msg){
  var t = qs('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

iniciar();
</script>
</body>
</html>
